name: Bootstrap Knowledge Graph v0.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-v2
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Assemble v0.2 source
        run: python .bootstrap/v2/assemble.py

      - name: Validate graph data
        run: python scripts/validate_data.py

      - name: Validate JavaScript syntax
        run: node --check site/app.js

      - name: Commit coherent v0.2 release
        run: |
          rm -f .github/workflows/bootstrap-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement knowledge graph v0.2 projections"
          git push
