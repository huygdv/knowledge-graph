name: Deploy Knowledge Canvas to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate knowledge graph
        run: python scripts/validate_data.py

      - name: Validate JSON artifacts
        run: |
          python -m json.tool site/data/project-history.json > /dev/null
          python -m json.tool site/templates/minimal.kg.json > /dev/null
          python -m json.tool site/templates/example.kg.json > /dev/null

      - name: Validate JavaScript syntax
        run: |
          node --check site/workspace-runtime.js
          node --check site/interaction-bridge.js
          node --check site/app.js
          node --check site/polish.js
          node --check site/focus-mode.js
          node --check site/responsive-shell.js
          node --check site/capture.js
          node --check site/interaction-mode.js
          node --check site/ux-hotfix-v024.js
          node --check site/workspace-manager.js
          node --check site/changelog/app.js

      - name: Verify runtime layer order
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('site/index.html').read_text()
          required = ['workspace-runtime.js', 'interaction-bridge.js', 'app.js', 'focus-mode.js', 'responsive-shell.js', 'capture.js', 'interaction-mode.js', 'ux-hotfix-v024.js', 'workspace-manager.js']
          positions = [html.index(name) for name in required]
          assert positions == sorted(positions), 'runtime scripts are not loaded in the required order'
          assert 'interaction-mode.css' in html
          assert 'ux-hotfix-v024.css' in html
          assert 'workspace-manager.css' in html
          PY

      - name: Start smoke-test server
        shell: bash
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > /tmp/kg-http.log 2>&1 &
          echo $! > /tmp/kg-http.pid
          for i in {1..80}; do
            curl -fsS http://127.0.0.1:8080/site/index.html > /dev/null && exit 0
            sleep .1
          done
          cat /tmp/kg-http.log || true
          exit 1

      - name: Browser smoke test interactions
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo 'No Chromium-compatible browser available'; exit 1; }

          timeout 60s "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --disable-default-apps \
            --disable-extensions \
            --disable-sync \
            --no-first-run \
            --user-data-dir=/tmp/kg-chrome-interactions \
            --window-size=1280,900 \
            --virtual-time-budget=8000 \
            --dump-dom \
            http://127.0.0.1:8080/scripts/smoke-interactions.html \
            > /tmp/kg-smoke.html

          grep -q 'data-smoke-status="pass"' /tmp/kg-smoke.html || {
            echo 'Interaction smoke test failed:'
            grep -o 'data-smoke-error="[^"]*"' /tmp/kg-smoke.html || true
            tail -100 /tmp/kg-smoke.html || true
            exit 1
          }

      - name: Browser smoke test Knowledge Packs
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo 'No Chromium-compatible browser available'; exit 1; }

          timeout 75s "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --disable-default-apps \
            --disable-extensions \
            --disable-sync \
            --no-first-run \
            --user-data-dir=/tmp/kg-chrome-workspaces \
            --window-size=1280,900 \
            --virtual-time-budget=12000 \
            --dump-dom \
            http://127.0.0.1:8080/scripts/smoke-workspaces.html \
            > /tmp/kg-workspaces-smoke.html

          grep -q 'data-workspace-smoke-status="pass"' /tmp/kg-workspaces-smoke.html || {
            echo 'Workspace smoke test failed:'
            grep -o 'data-workspace-smoke-error="[^"]*"' /tmp/kg-workspaces-smoke.html || true
            tail -120 /tmp/kg-workspaces-smoke.html || true
            exit 1
          }

      - name: Stop smoke-test server
        if: always()
        shell: bash
        run: |
          test -f /tmp/kg-http.pid && kill "$(cat /tmp/kg-http.pid)" 2>/dev/null || true

      - name: Verify public documentation pages
        run: |
          test -f site/system-design-overview/index.html
          test -f site/changelog/index.html
          test -f site/docs.css
          test -f docs/KNOWLEDGE_PACK_SCHEMA.md
          test -f site/templates/minimal.kg.json
          test -f site/templates/example.kg.json

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
