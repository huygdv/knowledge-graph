name: Deploy Knowledge Canvas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate knowledge graph
        run: python scripts/validate_data.py

      - name: Validate project history
        run: python -m json.tool site/data/project-history.json > /dev/null

      - name: Validate JavaScript syntax
        run: |
          node --check site/interaction-bridge.js
          node --check site/app.js
          node --check site/polish.js
          node --check site/focus-mode.js
          node --check site/responsive-shell.js
          node --check site/capture.js
          node --check site/interaction-mode.js
          node --check site/ux-hotfix-v024.js
          node --check site/changelog/app.js

      - name: Verify interaction layer order
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('site/index.html').read_text()
          required = ['interaction-bridge.js', 'app.js', 'focus-mode.js', 'responsive-shell.js', 'capture.js', 'interaction-mode.js', 'ux-hotfix-v024.js']
          positions = [html.index(name) for name in required]
          assert positions == sorted(positions), 'interaction scripts are not loaded in the required order'
          assert 'interaction-mode.css' in html
          assert 'ux-hotfix-v024.css' in html
          PY

      - name: Verify public documentation pages
        run: |
          test -f site/system-design-overview/index.html
          test -f site/changelog/index.html
          test -f site/docs.css

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
